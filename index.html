<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahana Birthday</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: linear-gradient(to right, #ff9a9e, #fad0c4);
  padding: 50px;
}
button {
  padding: 12px 20px;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  background: #ff6f61;
  color: white;
  cursor: pointer;
}
#result {
  margin-top: 20px;
  font-size: 22px;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>🎉 For Ahana 💖</h1>

<button onclick="showCountdown()">See Surprise</button>

<div id="result"></div>

<audio id="music" src="https://www2.cs.uic.edu/~i101/SoundFiles/HappyBirthday.wav"></audio>

<script>
function showCountdown() {

  const result = document.getElementById("result");

  let today = new Date();
  today.setHours(0,0,0,0);

  let year = today.getFullYear();

  let birthday = new Date(year, 4, 9); // May 9
  birthday.setHours(0,0,0,0);

  if (birthday < today) {
    birthday.setFullYear(year + 1);
  }

  let diff = birthday - today;
  let days = Math.floor(diff / (1000 * 60 * 60 * 24));

  if (days === 0) {
    result.innerHTML = "🎉 Happy Birthday Ahana! 🎂";
    document.getElementById("music").play();
    startConfetti();
  } else {
    result.innerHTML = `💖 ${days} day${days>1?"s":""} left for Ahana's birthday`;
  }
}

/* Simple confetti */
function startConfetti() {
  const canvas = document.createElement("canvas");
  document.body.appendChild(canvas);

  canvas.style.position = "fixed";
  canvas.style.top = 0;
  canvas.style.left = 0;

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const ctx = canvas.getContext("2d");

  let pieces = [];

  for (let i = 0; i < 120; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 6 + 2
    });
  }

  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "white";

    pieces.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
      p.y += 2;
      if (p.y > canvas.height) p.y = 0;
    });

    requestAnimationFrame(draw);
  }

  draw();
}
</script>

</body>
</html>
