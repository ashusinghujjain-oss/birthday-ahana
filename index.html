<!DOCTYPE html><html>
<head>
<title>Ahana 💖</title>
<style>
body{
text-align:center;
font-family:Arial;
background:linear-gradient(to right,#ff9a9e,#fad0c4);
padding:50px;
overflow:hidden;
}
button{
padding:12px 20px;
font-size:16px;
border:none;
border-radius:8px;
background:#ff6f61;
color:white;
}
#result{
margin-top:20px;
font-size:22px;
font-weight:bold;
}
canvas{
position:fixed;
top:0;
left:0;
}
</style>
</head><body><h1>🎉 For Ahana 💖</h1><button onclick="start()">See Surprise</button>

<div id="result"></div><canvas id="canvas"></canvas>

<audio id="song">
<source src="https://www.soundjay.com/human/happy-birthday-01.mp3" type="audio/mpeg">
</audio><script>

function start(){

let result=document.getElementById("result");

// FORCE TEST MODE
result.innerHTML="🎉 Happy Birthday Ahana! 🎂";

// PLAY MUSIC
let audio=document.getElementById("song");
audio.play().catch(()=>alert("Tap again to enable music"));

// START CONFETTI
confetti();

}

function confetti(){

let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let pieces=[];

for(let i=0;i<150;i++){
pieces.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*6+2
});
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

pieces.forEach(p=>{
ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fillStyle="white";
ctx.fill();
p.y+=3;
if(p.y>canvas.height) p.y=0;
});

requestAnimationFrame(draw);
}

draw();

}

</script></body>
</html>
